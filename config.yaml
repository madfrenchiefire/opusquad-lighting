# OpusQuad Lighting Configuration

# ---------------------------------------------------------------------------
# PKnight Easynode ARS2048B — Art-Net/sACN/RDM Controller
# ---------------------------------------------------------------------------
# The ARS2048B has 4 DMX output ports. Each port maps to one Art-Net universe:
#   Port 1  →  Universe 0   (DMX addresses 1-512)
#   Port 2  →  Universe 1   (DMX addresses 1-512 on that port)
#   Port 3  →  Universe 2
#   Port 4  →  Universe 3
#
# Connect all 4 SlimPAR 56s to Port 1 (they share the same DMX run).
#
# Finding the device IP:
#   Option A — Static Art-Net IP: The ARS2048B defaults to 2.0.0.1 with
#              subnet 255.0.0.0. Set your PC's ethernet adapter to 2.x.x.x /8
#              on the same interface, then ping 2.0.0.1.
#   Option B — DHCP: If you set the node to DHCP mode via its web UI,
#              check your router's device list for "ARS2048" or run:
#                python discover.py
#              to find it automatically via ArtPoll.
#   Option C — Broadcast: Set host to "2.255.255.255" (Art-Net broadcast)
#              to reach the node without knowing its exact IP. Slightly
#              chattier but works fine on a home network.

artnet:
  host: "2.0.0.1"     # change to your node's IP, or use "2.255.255.255" to broadcast
  port: 6454           # standard Art-Net UDP port — do not change
  universe: 0          # Port 1 on the ARS2048B = universe 0

# DMX start addresses for each SlimPAR 56 fixture (1-based, as set on the light).
# In 7-channel mode each fixture occupies 7 addresses, so space them 8 apart
# to leave a 1-address gap (common practice to avoid overlap confusion).
# Addresses: 1, 8, 15, 22  — set these on each fixture's dip switches.
fixtures:
  - name: "Par 1"
    dmx_start: 1
  - name: "Par 2"
    dmx_start: 8
  - name: "Par 3"
    dmx_start: 15
  - name: "Par 4"
    dmx_start: 22

# Pioneer Opus Quad network settings
opus_quad:
  # The Opus Quad broadcasts Pro DJ Link packets on your LAN.
  # Set this to your machine's IP on the same subnet as the Opus Quad.
  # Leave as "" to auto-detect.
  local_ip: ""
  # DJ Link beat/status packets arrive on these ports
  beat_port: 50001
  status_port: 50002
  announce_port: 50000

# ---------------------------------------------------------------------------
# Physical DMX controller input (optional)
# ---------------------------------------------------------------------------
# The ARS2048B can receive DMX from a physical controller on Port 3 or 4
# and re-broadcast it as Art-Net. Set the port direction to "Input" in the
# node's web UI, set input_universe to match, then enable below.
#
# Default channel mapping (see src/artnet_receiver.py to customise):
#   Ch 1 → master brightness fader
#   Ch 2 → show selector (fader sweeps through all 7 shows)
dmx_input:
  enabled: false
  universe: 2          # must match the universe set on the ARS2048B input port

# ---------------------------------------------------------------------------
# Light show settings
show:
  # BPM to use when no Opus Quad signal is detected
  fallback_bpm: 128.0
  # Active show: "beat_strobe", "color_cycle", "pulse", "fire", "chase", "rainbow"
  active_show: "beat_strobe"
  # Overall brightness 0.0-1.0
  brightness: 1.0
  # Transition speed between colors (0.0=instant, 1.0=slow)
  transition: 0.3
