# OpusQuad Lighting Configuration

# ---------------------------------------------------------------------------
# PKnight Easynode ARS2048B — Art-Net/sACN/RDM Controller
# ---------------------------------------------------------------------------
# Port-to-universe mapping:
#   Port 1  →  Universe 0   ← this app's beat-synced show output
#   Port 2  →  Universe 1   ← Freestyler (run alongside, no conflict)
#   Port 3  →  Universe 2   ← optional DMX input from physical controller
#   Port 4  →  Universe 3   ← spare
#
# Finding the node IP: run  python discover.py
# Factory default: 2.0.0.1 / 255.0.0.0  (set your PC's NIC to 2.0.0.2/8)

artnet:
  host: "2.0.0.1"     # node IP — use "2.255.255.255" to broadcast
  port: 6454
  universe: 0          # Port 1 on the ARS2048B

# sACN (E1.31) — enable as an alternative or supplement to Art-Net
sacn:
  enabled: false
  universe: 1          # sACN universes are 1-based; 1 = same physical port as Art-Net universe 0

# ---------------------------------------------------------------------------
# Fixtures
# ---------------------------------------------------------------------------
# profile: use a built-in name (chauvet_slimpar56_7ch, generic_rgb_3ch, ...)
#          or a path to an OFL JSON file.
# group: assign fixtures to groups for independent show assignment.
# In 7ch mode each fixture uses 7 addresses — space dmx_start 8 apart.
fixtures:
  - name: "Par 1"
    profile: "chauvet_slimpar56_7ch"
    dmx_start: 1
    universe: 0
    group: "main"
  - name: "Par 2"
    profile: "chauvet_slimpar56_7ch"
    dmx_start: 8
    universe: 0
    group: "main"
  - name: "Par 3"
    profile: "chauvet_slimpar56_7ch"
    dmx_start: 15
    universe: 0
    group: "main"
  - name: "Par 4"
    profile: "chauvet_slimpar56_7ch"
    dmx_start: 22
    universe: 0
    group: "main"

# ---------------------------------------------------------------------------
# Pioneer Opus Quad (Pro DJ Link)
# ---------------------------------------------------------------------------
opus_quad:
  local_ip: ""          # leave blank to auto-detect
  beat_port: 50001
  status_port: 50002
  announce_port: 50000

# ---------------------------------------------------------------------------
# Audio analysis (Behringer XR-18 via ASIO)
# ---------------------------------------------------------------------------
# Run  python -c "from src.audio_analyzer import list_audio_devices; [print(d) for d in list_audio_devices()]"
# to list available devices and find your XR-18's index.
audio:
  enabled: false
  device_index: null    # set to the integer index of your ASIO/XR-18 device
  channels: 2           # how many input channels to capture (2 = stereo main mix)
  samplerate: 48000
  blocksize: 1024
  input_channel: 0      # which captured channel to analyze (0-based)

# ---------------------------------------------------------------------------
# MIDI controller input
# ---------------------------------------------------------------------------
midi:
  enabled: false
  port_name: null       # null = first available port; run discover to see options

# ---------------------------------------------------------------------------
# OSC server (TouchOSC, Lemur, etc.)
# ---------------------------------------------------------------------------
osc:
  enabled: false
  host: "0.0.0.0"
  port: 8000

# ---------------------------------------------------------------------------
# Physical DMX controller input via ARS2048B Port 3
# ---------------------------------------------------------------------------
dmx_input:
  enabled: false
  universe: 2

# ---------------------------------------------------------------------------
# Show settings
# ---------------------------------------------------------------------------
show:
  fallback_bpm: 128.0
  active_show: "beat_strobe"
  brightness: 1.0
  transition_beats: 2.0       # crossfade length in beats when switching shows
  auto_select_by_bpm: false   # automatically pick show based on BPM range
  strobe_max_hz: 10.0         # safety cap — no fixture will strobe faster than this
  blackout: false             # persistent blackout flag

# ---------------------------------------------------------------------------
# Config profiles directory
# ---------------------------------------------------------------------------
profiles_dir: "profiles"

# ---------------------------------------------------------------------------
# Data directory (scenes DB, track DB)
# ---------------------------------------------------------------------------
data_dir: "data"
